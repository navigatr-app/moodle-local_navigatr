name: Assign new PRs to Omid

# Auto-assigns every newly opened PR (any author, including fork PRs) to @omufeed
# so Omid gets one "Assigned to me" view + a notification across all repos.
# Uses pull_request_target so the base-repo token has write access and the run
# is driven by THIS file on the default branch (a fork PR cannot alter it). No
# checkout of PR code, so there is no untrusted-code execution risk.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign omufeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # REST add-assignees only ADDS to the assignee set, so it works with the App
        # installation token even when an agent (e.g. Claude) is already assigned.
        # gh pr edit --add-assignee uses GraphQL replaceActorsForAssignable, which App
        # tokens cannot call once an agent actor is in the assignee set.
        run: gh api --method POST "repos/$REPO/issues/$PR_NUMBER/assignees" -f "assignees[]=omufeed"
